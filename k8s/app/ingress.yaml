apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyberchef
  namespace: cyberchef
spec:
  ingressClassName: nginx
  rules:
    # No host yet: matches any hostname. A real host is added when ExternalDNS is set up.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cyberchef
                port:
                  name: http